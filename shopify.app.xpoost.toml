# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "872f7f6415d1c243c11ccdfe9426b07f"
name = "XPoost"
application_url = "https://sea-turtle-app-a4uct.ondigitalocean.app"
embedded = true

[app_proxy]
url = "https://sea-turtle-app-a4uct.ondigitalocean.app/proxy"
prefix = "apps"
subpath = "xpoost"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_discounts,read_inventory,read_products,read_orders"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/cancelled"
  topics = [ "orders/cancelled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [
  "https://sea-turtle-app-a4uct.ondigitalocean.app/api/auth",
  "https://sea-turtle-app-a4uct.ondigitalocean.app/auth/callback",
  "https://sea-turtle-app-a4uct.ondigitalocean.app/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true
