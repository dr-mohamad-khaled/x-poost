# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "352d0d1a97ca7c5cb20a6a0c1ab886b7"
application_url = "https://xpoost-instachiq-5mrss.ondigitalocean.app"
embedded = true
name = "Xpoost-instachiq"

[app_proxy]
url = "https://xpoost-instachiq-5mrss.ondigitalocean.app/proxy"
prefix = "apps"
subpath = "xpoost"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_app_proxy,write_discounts,read_inventory,read_products,read_orders,read_customers"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[auth]
redirect_urls = [
  "https://xpoost-instachiq-5mrss.ondigitalocean.app/api/auth",
  "https://xpoost-instachiq-5mrss.ondigitalocean.app/auth/callback",
  "https://xpoost-instachiq-5mrss.ondigitalocean.app/auth/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true
